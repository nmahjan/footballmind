# FootballMind scheduled jobs. Add repo secrets: DATABASE_URL (Neon pooled),
# FOOTBALL_DATA_API_KEY.
name: footballmind-jobs

on:
  schedule:
    - cron: "17 */6 * * *"     # sync every 6 hours (offset minute avoids load spikes)
    - cron: "30 5 * * 1"       # retrain weekly, Monday 05:30 UTC
  workflow_dispatch:           # manual run from the Actions tab
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [sync, sync-enrich, retrain]
        default: sync
      full:
        description: "Full season backfill? (tick for first run / new leagues)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in 1 2 3; do
            python footballmind_migrate.py && exit 0
            echo "Migration attempt ${attempt} failed — retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run sync-enrich
        if: github.event.inputs.job == 'sync-enrich'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python footballmind_jobs.py sync-enrich

      - name: Run sync
        if: github.event.schedule == '17 */6 * * *' || github.event.inputs.job == 'sync'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python footballmind_jobs.py sync ${{ github.event.inputs.full == 'true' && '--full' || '' }}

      - name: Run retrain
        if: github.event.schedule == '30 5 * * 1' || github.event.inputs.job == 'retrain'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python footballmind_jobs.py retrain

      - name: Failure summary
        if: failure()
        run: |
          echo "## Scheduled job failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: **footballmind-jobs**. Check logs above." >> "$GITHUB_STEP_SUMMARY"

# Intent parser and other unit tests (no DB required).
name: footballmind-tests

on:
  push:
    branches: [main]
    paths:
      - "footballmind/**/*.py"
      - "footballmind/frontend/**"
      - "footballmind/requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: footballmind/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: footballmind
      - run: python -m pytest tests/ -q
        working-directory: footballmind
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: footballmind/frontend/package-lock.json
      - run: npm ci && npm test
        working-directory: footballmind/frontend

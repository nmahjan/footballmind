# Intent parser and other unit tests (no DB required).
name: footballmind-tests

on:
  push:
    branches: [main]
    paths:
      - "footballmind_*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/footballmind-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

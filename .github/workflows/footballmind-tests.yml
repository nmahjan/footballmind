# Intent parser and other unit tests (no DB required).
name: footballmind-tests

on:
  push:
    branches: [main]
    paths:
      - "footballmind/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r footballmind/requirements.txt
      - run: python -m pytest tests/test_*.py -q
        working-directory: footballmind
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm test
        working-directory: footballmind/frontend

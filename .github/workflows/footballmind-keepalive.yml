# Ping Render backend so the free tier stays warm between user visits.
name: footballmind-keepalive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        env:
          API_URL: ${{ vars.VITE_API_BASE }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "VITE_API_BASE repo variable not set — skipping"
            exit 0
          fi
          curl -fsS --max-time 45 "${API_URL%/}/api/health" | head -c 200
          echo ""
          echo "Backend responded OK"
